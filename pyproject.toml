[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eureka-vacuum"
version = "1.0.0"
description = "Goal-driven control and visualisation for the Eureka vacuum simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25",
    "numpy>=1.26",
    "pillow>=10",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vacuum = "vacuum.__main__:main"
vacuum-headless = "vacuum.cli.headless:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a running vacuum simulator",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
